[package]
name = "thinkboard"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Obsidian boards over your desktop, a hotkey away"
homepage = "https://vestigecounty.github.io/thinkboard/"
repository = "https://github.com/vestigecounty/thinkboard"

# The Linux packages release.yml builds: a .deb (cargo-deb) and an .rpm
# (cargo-generate-rpm), each the files the tarball carries, put where a
# system install puts them. Built with `--target`, which both read the
# `target/release` paths below against. Libraries the binary links are found
# by each tool; the ones winit and wgpu open at run time — Wayland, X11's
# keyboard, Vulkan or EGL — are recommended, as any desktop has them.
[package.metadata.deb]
maintainer = "Vestige County <support@vestigecounty.com>"
copyright = "Vestige County"
section = "utils"
depends = "$auto"
recommends = "libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libvulkan1 | libegl1, xdg-desktop-portal"
extended-description = """\
Summon a board directly above your desktop with a hotkey, and put it away \
again. Open your Obsidian vault's boards, or run standalone: cards, links, \
Markdown and pictures, saved straight back to the .canvas file."""
assets = [
    ["target/release/thinkboard", "usr/bin/", "755"],
    ["packaging/linux/com.vestigecounty.ThinkBoard.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/com.vestigecounty.ThinkBoard.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/thinkboard.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/thinkboard.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/thinkboard/", "644"],
]

[package.metadata.generate-rpm]
summary = "Obsidian boards, a hotkey away"
assets = [
    { source = "target/release/thinkboard", dest = "/usr/bin/thinkboard", mode = "755" },
    { source = "packaging/linux/com.vestigecounty.ThinkBoard.desktop", dest = "/usr/share/applications/com.vestigecounty.ThinkBoard.desktop", mode = "644" },
    { source = "packaging/linux/com.vestigecounty.ThinkBoard.metainfo.xml", dest = "/usr/share/metainfo/com.vestigecounty.ThinkBoard.metainfo.xml", mode = "644" },
    { source = "assets/thinkboard.svg", dest = "/usr/share/icons/hicolor/scalable/apps/thinkboard.svg", mode = "644" },
    { source = "assets/thinkboard.png", dest = "/usr/share/icons/hicolor/256x256/apps/thinkboard.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/thinkboard/LICENSE", mode = "644", doc = true },
]

[features]
# Windows only: force the GUI subsystem (no console window) regardless of build
# profile. See the windows_subsystem attribute in src/main.rs.
no-console = []

# The desktop app is the root package; `crates/core` holds the UI-agnostic
# document logic (no iced/wgpu) that a future mobile front-end will also use.
# The [patch] below applies workspace-wide.
[workspace]
members = ["crates/core", "crates/ffi"]

[dependencies]
thinkboard-core = { path = "crates/core" }
arboard = "3.4"
base64 = "0.22.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
cosmic-text = "0.15"
env_logger = "0.11"
global-hotkey = "0.8.0"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "tokio"] }
# The (patched) vendored iced_graphics, for its editor line-alignment control.
iced_graphics = "0.14"
# The (patched) vendored iced_wgpu, to choose the antialiasing once the GPU is known.
iced_wgpu = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
notify = "8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Native "open canvas" dialog when no canvas is configured. The xdg-portal
# backend (not gtk3) keeps the Linux build free of a GTK link dependency.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
wuff = { version = "0.2.5", default-features = false, features = ["brotli"] }

# Menu-bar / notification-area tray. Only macOS + Windows: the Linux backend
# links GTK/libappindicator (C), which our zig cross-build can't satisfy.
# `cargo bench` would otherwise also run the unit-test binaries as benchmarks,
# where they reject criterion's own flags.
[lib]
bench = false

[[bin]]
name = "thinkboard"
bench = false

# Benchmarks only. Criterion's default features pull in plotters and rayon;
# `cargo_bench_support` alone is what `cargo bench` actually needs.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# The same crate as above, with its test-only node/edge builders switched on —
# so both crates' tests share one set rather than growing their own.
thinkboard-core = { path = "crates/core", features = ["fixtures"] }
# The offscreen tour (src/app/tour.rs) drives a `UserInterface` and runs tasks
# itself, which iced keeps behind its own runtime. Already in the graph via iced.
iced_runtime = "0.14"
# As on Linux, so the COSMIC shortcut file's tests run on every platform.
ron = "0.12"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.19"

# Linux tray via the StatusNotifierItem protocol. 0.3+ is required: it talks
# D-Bus through pure-Rust zbus (no GTK, no C libdbus), so it cross-compiles with
# zig — unlike 0.2, which links C libdbus, and unlike tray-icon's GTK backend.
# Shows on KDE natively; GNOME needs the AppIndicator extension.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
# A runtime for the startup file dialog: rfd's portal backend drives zbus, which
# our graph routes onto Tokio. See pick_canvas_file in app/startup.rs. (net/time
# drivers come from zbus's own tokio features via unification.)
tokio = { version = "1", features = ["rt-multi-thread"] }
# The summon shortcut under Wayland, through the desktop's GlobalShortcuts
# portal (app/summon.rs). Already in the graph for rfd's file dialogs.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
# COSMIC has no such portal: the shortcut is added to its own shortcuts file
# (app/summon/cosmic.rs), read and written with the parser COSMIC reads it with.
ron = "0.12"

[target.'cfg(windows)'.dependencies]
# The Unix sockets Windows 10 (1803) and later take, with std's API, so a
# second launch hands over to the copy running as it does elsewhere
# (`app::summon`). Already in the graph, through zbus.
uds_windows = "1.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSWindow", "NSApplication", "NSScreen", "NSRunningApplication", "NSPanel", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSString", "NSObject", "block2", "NSOperation"] }

# Embeds the app icon into the Windows .exe (build.rs). Host-side build tool; it
# shells out to the MinGW resource compiler when cross-compiling.
[build-dependencies]
winresource = "0.1"

[patch.crates-io]
# Center-aligned text editing: see vendor/iced_graphics/src/text/editor.rs
iced_graphics = { path = "vendor/iced_graphics" }
# Honor wgpu backend env vars so WGPU_DX12_PRESENTATION_SYSTEM=visual can pick
# the DirectComposition swapchain (transparent overlay on Windows): see
# vendor/iced_wgpu/src/window/compositor.rs
iced_wgpu = { path = "vendor/iced_wgpu" }
# A style change inside a word (`x**bold**y`, inline code after a space) was
# dropped by the ASCII shaping fast path: see vendor/cosmic-text/src/shape.rs
cosmic-text = { path = "vendor/cosmic-text" }

# Criterion supplies its own `main`, so the default libtest harness is off.
[[bench]]
name = "render"
harness = false
