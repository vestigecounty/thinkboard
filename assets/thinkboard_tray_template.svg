<!-- macOS menu-bar template icon: the ThinkBoard mark as a solid black
     silhouette on transparency. macOS ignores the color and renders the alpha
     in the menu-bar tint (dark on light bars, light on dark). Keep it a clean
     silhouette — no background plate — or template mode shows a filled blob.
     Rasterize with: rsvg-convert -w 64 -h 64 thinkboard_tray_template.svg
                       -o thinkboard_tray_template.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <g transform="translate(128,128) scale(1.28)" fill="#000000">
    <!-- Four diagonal spokes from the core toward the corner petals. -->
    <g stroke="#000000" stroke-width="7.84" stroke-linecap="round">
      <line transform="rotate(45)"  x1="0" y1="-29.6" x2="0" y2="-52.9"/>
      <line transform="rotate(135)" x1="0" y1="-29.6" x2="0" y2="-52.9"/>
      <line transform="rotate(225)" x1="0" y1="-29.6" x2="0" y2="-52.9"/>
      <line transform="rotate(315)" x1="0" y1="-29.6" x2="0" y2="-52.9"/>
    </g>
    <!-- Eight petals in a radial burst. -->
    <path transform="rotate(0)"   d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(45)"  d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(90)"  d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(135)" d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(180)" d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(225)" d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(270)" d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <path transform="rotate(315)" d="M0,-44.7 C16.1,-56.4 16.1,-71.9 0,-83.6 C-16.1,-71.9 -16.1,-56.4 0,-44.7 Z"/>
    <!-- Core dot. -->
    <circle r="14.5"/>
  </g>
</svg>
