name: Release

on:
  push:
    tags: ["v*"]
  # Allow a manual dry-run (builds artifacts but only publishes on a real tag).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu the runners have, so the binary asks
          # for an old glibc (2.35) and runs on the distros since.
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            arch: aarch64
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # Built for both Apple arches and fused into one universal binary.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      # A tag `vX.Y.Z` yields VERSION=X.Y.Z; a manual run falls back to the
      # Cargo.toml version with a `-dev` suffix.
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "VERSION=${V}-dev" >> "$GITHUB_ENV"
          fi

      # One loop covers single- and multi-target (macOS) builds uniformly.
      - name: Build release binaries
        shell: bash
        run: |
          IFS=',' read -ra TARGETS <<< "${{ matrix.targets }}"
          for t in "${TARGETS[@]}"; do
            echo "::group::cargo build --target $t"
            cargo build --release --locked --target "$t"
            echo "::endgroup::"
          done

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.targets }}"
          mkdir -p dist
          STAGE="thinkboard-${VERSION}-linux-${ARCH}"
          mkdir "$STAGE"
          install -m755 "target/${TARGET}/release/thinkboard" "$STAGE/thinkboard"
          strip "$STAGE/thinkboard" || true
          # Desktop integration: a launcher, icons (scalable SVG + 256px PNG),
          # what software centres show of it, and a user-level installer that
          # drops them into the right XDG dirs. The AUR's package installs
          # from this tarball too.
          install -m755 packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/com.vestigecounty.ThinkBoard.desktop "$STAGE/"
          cp packaging/linux/com.vestigecounty.ThinkBoard.metainfo.xml "$STAGE/"
          cp assets/thinkboard.svg assets/thinkboard.png "$STAGE/"
          cp README* LICENSE* "$STAGE/" 2>/dev/null || true
          tar -C "$PWD" -czf "dist/${STAGE}.tar.gz" "$STAGE"
          # And under a name that's the same every release, which
          # `releases/latest/download/<name>` always finds: the website's
          # download links, which then never need the version.
          cp "dist/${STAGE}.tar.gz" "dist/thinkboard-linux-${ARCH}.tar.gz"

      - name: Install the .deb and .rpm builders
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # The same files as the tarball, put where a system install puts them —
      # see [package.metadata.deb] and [package.metadata.generate-rpm] in
      # Cargo.toml. A manual run's `-dev` is `~dev` to both, which sorts it
      # before the release it leads up to.
      - name: Package (.deb, .rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.targets }}"
          PKG_VERSION="${VERSION//-/\~}"
          case "$ARCH" in x86_64) DEB_ARCH=amd64 ;; aarch64) DEB_ARCH=arm64 ;; esac
          DEB="dist/thinkboard_${PKG_VERSION}_${DEB_ARCH}.deb"
          RPM="dist/thinkboard-${PKG_VERSION}-1.${ARCH}.rpm"
          cargo deb --no-build --target "$TARGET" --deb-version "$PKG_VERSION" --output "$DEB"
          cargo generate-rpm --target "$TARGET" --set-metadata "version = \"${PKG_VERSION}\"" --output "$RPM"
          cp "$DEB" "dist/thinkboard-linux-${ARCH}.deb"
          cp "$RPM" "dist/thinkboard-linux-${ARCH}.rpm"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          STAGE="thinkboard-${VERSION}-windows-x86_64"
          mkdir "$STAGE"
          cp target/x86_64-pc-windows-msvc/release/thinkboard.exe "$STAGE/"
          cp README* LICENSE* "$STAGE/" 2>/dev/null || true
          # 7-Zip ships on the Windows runners.
          7z a "dist/${STAGE}.zip" "./${STAGE}" >/dev/null
          # A name that's the same every release — see the Linux step.
          cp "dist/${STAGE}.zip" dist/thinkboard-windows-x86_64.zip

      - name: Package (macOS universal .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="ThinkBoard.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Fuse the two arch builds into one universal binary.
          lipo -create -output "$APP/Contents/MacOS/thinkboard" \
            target/aarch64-apple-darwin/release/thinkboard \
            target/x86_64-apple-darwin/release/thinkboard
          strip "$APP/Contents/MacOS/thinkboard" || true
          cp assets/thinkboard.icns "$APP/Contents/Resources/thinkboard.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>ThinkBoard</string>
            <key>CFBundleDisplayName</key><string>ThinkBoard</string>
            <key>CFBundleIdentifier</key><string>com.thinkboard.app</string>
            <key>CFBundleExecutable</key><string>thinkboard</string>
            <key>CFBundleIconFile</key><string>thinkboard</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <!-- Agent app: no Dock icon, matches the runtime Accessory policy. -->
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          # Signed ad hoc: no identity, so it vouches for nobody, and the first
          # launch of a download still warns. But it seals the bundle — its
          # Info.plist bound, both arches signed. Without it only the arm64
          # slice had a signature (the linker's) and Gatekeeper found "no
          # usable signature" at all. Last, since any change after breaks it.
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP"
          mkdir -p dist
          # `ditto` produces a Finder-friendly zip that preserves the bundle.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/thinkboard-${VERSION}-macos-universal.zip"
          # A name that's the same every release — see the Linux step.
          cp "dist/thinkboard-${VERSION}-macos-universal.zip" dist/thinkboard-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The Flatpak's crates, listed for its offline build from Cargo.lock by
  # flatpak-builder-tools' generator at a known commit. Listed here, on the
  # runner, rather than in the Flatpak's own job: that runs in Flathub's
  # image, which is the freedesktop SDK — no dnf, nor any package manager to
  # install the generator's aiohttp and tomlkit with. The script names its
  # own dependencies in its header, and pipx installs those.
  cargo-sources:
    name: Flatpak crate list
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: List the crates for an offline build
        run: |
          curl -sSfL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/41c20aa10819cdb2a4f3ca171758a96d1955c018/cargo/flatpak-cargo-generator.py
          pipx run /tmp/flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: cargo-sources.json
          if-no-files-found: error

  # The Flatpak, built from source offline as Flathub would build it, as a
  # bundle per arch: `flatpak install thinkboard-….flatpak`.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: cargo-sources
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "VERSION=${V}-dev" >> "$GITHUB_ENV"
          fi

      # Beside the manifest, which names it as a source.
      - name: Take the crate list
        uses: actions/download-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak

      # The image installs the SDK in a layer of its own, and isn't rebuilt
      # as the SDK moves on, so flatpak-builder updates it first. An update
      # moves the old one aside, which the container's overlay filesystem
      # refuses for a directory in a lower layer ("Invalid cross-device
      # link"), and flatpak-builder then crashed (exit 139; on x86_64, not
      # aarch64; flatpak/flatpak-github-actions#267, closed unfixed). Copied
      # once, the installation is all in the container's own layer.
      - name: Let the image's SDK be updated
        shell: bash
        run: |
          dir=$(flatpak --installations | head -n1)
          echo "Copying ${dir} into the container's own layer"
          cp -a "$dir" "$dir.copy"
          rm -rf "$dir"
          mv "$dir.copy" "$dir"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: thinkboard-${{ env.VERSION }}-linux-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/com.vestigecounty.ThinkBoard.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          arch: ${{ matrix.arch }}

  publish:
    name: Publish GitHub Release
    needs: [build, flatpak]
    # Only cut a Release for real tags; a manual dispatch just builds artifacts.
    # A Flatpak that didn't build doesn't hold the rest back.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # An artifact only to reach the Flatpak's build, not something to
      # download. Absent when its job failed, which holds nothing back.
      - name: Leave out the Flatpak's crate list
        run: rm -f artifacts/cargo-sources.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The Homebrew tap's formula, pointed at the release just published:
  # packaging/homebrew/thinkboard.rb, with its version and checksum filled in,
  # committed to vestigecounty/homebrew-tap. GITHUB_TOKEN can't write to
  # another repo, so it pushes with a deploy key that can write to the tap
  # and nothing else (the HOMEBREW_TAP_KEY secret).
  homebrew:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check for the tap's key
        env:
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_KEY" ]; then
            echo "::error::The HOMEBREW_TAP_KEY secret isn't set: the release is out, but the tap still offers the last one."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: vestigecounty/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap

      # The very zip the release carries, so the checksum is of what
      # Homebrew will download.
      - name: Download the macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: artifacts

      - name: Write and push the formula
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "artifacts/thinkboard-${VERSION}-macos-universal.zip" | cut -d' ' -f1)
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA256}/" \
            packaging/homebrew/thinkboard.rb > tap/Formula/thinkboard.rb
          cd tap
          git add Formula/thinkboard.rb
          if git diff --cached --quiet; then
            echo "The tap already offers ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "thinkboard ${VERSION}"
          git push -q origin HEAD

  # The AUR's thinkboard-bin, pointed at the release just published:
  # packaging/aur's PKGBUILD and .SRCINFO, with the version and each arch's
  # tarball checksum filled in, pushed to aur.archlinux.org with the key of
  # the AUR account that maintains it (the AUR_SSH_KEY secret). Until that's
  # set, it says so and leaves the AUR as it was.
  aur:
    name: Update the AUR package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check for the AUR key
        id: key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::The AUR_SSH_KEY secret isn't set: the AUR's thinkboard-bin still offers the last release, if any."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'

      # The very tarballs the release carries, so the checksums are of what
      # makepkg will download.
      - name: Download the Linux builds
        if: steps.key.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts
          merge-multiple: true

      - name: Write and push the package
        if: steps.key.outputs.skip != 'true'
        shell: bash
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_X86_64=$(sha256sum "artifacts/thinkboard-${VERSION}-linux-x86_64.tar.gz" | cut -d' ' -f1)
          SHA_AARCH64=$(sha256sum "artifacts/thinkboard-${VERSION}-linux-aarch64.tar.gz" | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone -q ssh://aur@aur.archlinux.org/thinkboard-bin.git aur
          for file in PKGBUILD .SRCINFO; do
            sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256_X86_64@/${SHA_X86_64}/" -e "s/@SHA256_AARCH64@/${SHA_AARCH64}/" \
              "packaging/aur/${file}" > "aur/${file}"
          done
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already offers ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "thinkboard-bin ${VERSION}"
          git push -q origin HEAD:master
