name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: build · test · clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result even if one fails — a Windows-only or
      # macOS-only break shouldn't hide the others (the platform modules only
      # compile on their own target, so each OS exercises different code).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # No apt/brew step: the dependency graph is pure-Rust with dlopen'd
      # windowing (winit/wgpu), rustls TLS (no OpenSSL), and the xdg-portal/ksni
      # backends on Linux (no GTK) — so nothing needs system dev packages to
      # build. This is the same reason the local `cargo zigbuild` works without
      # a sysroot. Add libs here only if a future dep starts hard-linking one.

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # `--locked` fails if Cargo.lock is stale, catching un-committed
      # dependency bumps. `--all-targets` also compiles the test harness.
      # `--workspace` is required, not cosmetic: the root Cargo.toml is both a
      # `[package]` and the `[workspace]` root, so a bare `cargo <cmd>` here
      # covers only the `thinkboard` package — thinkboard-core and
      # thinkboard-ffi would go unbuilt, unlinted, and untested.
      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Clippy
        # Warnings fail the job. The lints the code means to break are
        # `#[allow]`ed where they're broken, each with its reason, so a new
        # warning is news rather than one more in a count.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
